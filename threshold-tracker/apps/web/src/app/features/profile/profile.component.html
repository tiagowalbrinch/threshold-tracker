<div class="max-w-2xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-center gap-3 mb-8">
    <a routerLink="/dashboard"
      class="p-2 text-white/40 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
    <h1 class="text-2xl font-bold text-white">Profile Settings</h1>
  </div>

  @if (loading()) {
    <div class="animate-pulse space-y-4">
      @for (i of [1,2,3]; track i) {
        <div class="h-14 bg-white/5 rounded-lg"></div>
      }
    </div>
  }

  @if (!loading()) {
    <div class="bg-white/[0.03] border border-white/10 rounded-2xl p-6 space-y-6">
      @if (error()) {
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-lg px-4 py-3">
          {{ error() }}
        </div>
      }
      @if (success()) {
        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm rounded-lg px-4 py-3">
          Profile saved successfully.
        </div>
      }

      <div>
        <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Email</label>
        <p class="text-white/40 text-sm px-3 py-2 bg-white/5 border border-white/10 rounded-lg">{{ email() }}</p>
      </div>

      <div>
        <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Display Name</label>
        <input [value]="displayName()" (input)="displayName.set($any($event.target).value)"
          class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white outline-none focus:border-white/20" />
      </div>

      <div>
        <h3 class="text-white/60 text-xs uppercase tracking-wider mb-3">Default Settings for Score Attempts</h3>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-white/40 text-xs block mb-2">Sensitivity</label>
            <input [value]="defaultSensitivity()" (input)="defaultSensitivity.set($any($event.target).value)"
              placeholder="0.8"
              class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none" />
          </div>
          <div>
            <label class="text-white/40 text-xs block mb-2">FOV</label>
            <input type="number" [value]="defaultFov()" (input)="defaultFov.set($any($event.target).value)"
              placeholder="103"
              class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none" />
          </div>
          <div>
            <label class="text-white/40 text-xs block mb-2">DPI</label>
            <input type="number" [value]="defaultDpi()" (input)="defaultDpi.set($any($event.target).value)"
              placeholder="800"
              class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none" />
          </div>
        </div>
      </div>

      <div class="flex justify-end">
        <button (click)="onSave()" [disabled]="saving()"
          class="px-6 py-2 bg-violet-600 hover:bg-violet-500 disabled:opacity-50 text-white rounded-lg font-medium transition-colors">
          @if (saving()) { Saving... } @else { Save Changes }
        </button>
      </div>
    </div>
  }
</div>

<p-card styleClass="task-card task-card--{{ task().type.toLowerCase() }}">
  <div class="card-top">
    <p-tag [value]="task().type" [severity]="typeSeverity()" />
    <span class="attempts">
      <i class="pi pi-sync"></i> {{ task().attempts }}
    </span>
  </div>
  <h3 class="task-name">{{ task().name }}</h3>
  <div class="task-stats">
    <div class="stat">
      <span class="label">PB</span>
      <span class="value">{{ task().pb | number:'1.0-0' }}</span>
    </div>
    <div class="stat">
      <span class="label">Threshold</span>
      <span class="value muted">
        {{ task().threshold ? (task().threshold | number:'1.0-0') : '—' }}
      </span>
    </div>
  </div>
  @if (progress() !== null) {
    <p-progressbar [value]="progress()!" styleClass="task-progress" />
  }
  <div class="card-actions">
    <p-button
      label="Detalhes"
      icon="pi pi-arrow-right"
      iconPos="right"
      size="small"
      variant="text"
      [routerLink]="['/task', task().id]"
    />
  </div>
</p-card>

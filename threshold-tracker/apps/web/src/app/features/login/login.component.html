<div class="min-h-screen bg-[#08080d] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-violet-500 to-cyan-500 flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/>
          <line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/>
          <line x1="12" y1="22" x2="12" y2="18"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-white/40 text-sm mt-1">Sign in to your ThresholdTracker account</p>
    </div>

    <div class="bg-white/[0.03] border border-white/10 rounded-2xl p-6">
      @if (error()) {
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-lg px-4 py-3 mb-4">
          {{ error() }}
        </div>
      }

      <div class="space-y-4">
        <div>
          <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Email</label>
          <input type="email" [value]="email()" (input)="email.set($any($event.target).value)"
            placeholder="you@example.com"
            class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none focus:border-white/20" />
        </div>
        <div>
          <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Password</label>
          <input type="password" [value]="password()" (input)="password.set($any($event.target).value)"
            placeholder="••••••••"
            class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none focus:border-white/20" />
        </div>
        <button (click)="onSubmit()" [disabled]="loading()"
          class="w-full py-2.5 bg-violet-600 hover:bg-violet-500 disabled:opacity-50 text-white rounded-lg font-medium transition-colors">
          @if (loading()) { Signing in... } @else { Sign In }
        </button>
      </div>

      <p class="text-center text-white/30 text-sm mt-4">
        Don't have an account?
        <a routerLink="/register" class="text-violet-400 hover:text-violet-300">Register</a>
      </p>
    </div>
  </div>
</div>

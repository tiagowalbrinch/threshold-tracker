<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 px-4">
  <div class="bg-[#0f0f17] border border-white/10 rounded-2xl p-6 max-w-md w-full">
    <h2 class="text-white text-lg font-semibold mb-4">New Task</h2>

    @if (duplicateTaskId) {
      <div class="bg-amber-500/10 border border-amber-500/20 rounded-lg px-4 py-3 mb-4">
        <p class="text-amber-400 text-sm mb-2">A task with this name already exists.</p>
        <button (click)="goToExisting.emit()"
          class="text-amber-400 hover:text-amber-300 text-sm font-medium underline">
          Go to existing task →
        </button>
      </div>
    }

    <div class="space-y-4">
      <div>
        <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Task Name</label>
        <input [value]="name()" (input)="name.set($any($event.target).value)"
          placeholder="E.g. Gridshot, Sixshot..."
          class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none focus:border-white/20" />
      </div>
      <div>
        <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Category</label>
        <select [value]="category()" (change)="category.set($any($event.target).value)"
          class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white outline-none focus:border-white/20">
          @for (c of categories; track c.value) {
            <option [value]="c.value" class="bg-[#0f0f17]">{{ c.label }}</option>
          }
        </select>
      </div>
      <div>
        <label class="text-white/60 text-xs uppercase tracking-wider block mb-2">Notes (optional)</label>
        <textarea [value]="notes()" (input)="notes.set($any($event.target).value)"
          placeholder="Details about the task..."
          class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/20 outline-none focus:border-white/20 h-20 resize-none"></textarea>
      </div>
      <div class="flex gap-3 justify-end">
        <button (click)="close.emit()"
          class="px-4 py-2 bg-white/5 border border-white/10 text-white rounded-lg text-sm">Cancel</button>
        <button (click)="onSave()" [disabled]="!name().trim()"
          class="px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-lg text-sm font-medium disabled:opacity-50">
          Create Task
        </button>
      </div>
    </div>
  </div>
</div>
